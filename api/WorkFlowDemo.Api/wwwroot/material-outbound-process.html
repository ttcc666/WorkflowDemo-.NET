<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>物料出库处理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/site.css" rel="stylesheet" />
</head>
<body>
    <div class="container py-4">
        <div class="main-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="page-title mb-0">
                    <i class="bi bi-truck text-primary"></i>
                    物料出库处理
                </h1>
                <div>
                    <a href="scan.html" class="btn btn-outline-secondary me-2">
                        <i class="bi bi-arrow-left me-2"></i>返回扫描
                    </a>
                    <a href="index.html" class="btn btn-outline-secondary">
                        <i class="bi bi-house me-2"></i>返回首页
                    </a>
                </div>
            </div>

            <!-- 批号信息 -->
            <div class="alert alert-info d-flex align-items-center mb-4" role="alert">
                <i class="bi bi-tag-fill me-3 fs-4"></i>
                <div class="flex-grow-1">
                    <div class="fw-bold">批号信息</div>
                    <div class="fs-5" id="batchNumber">-</div>
                    <small class="text-muted">工作流实例: <span id="workflowId">-</span></small>
                </div>
            </div>

            <!-- 审批区域 -->
            <div id="approvalSection" class="d-none">
                <div class="alert alert-warning mb-4">
                    <h5><i class="bi bi-exclamation-triangle me-2"></i>需要审批</h5>
                    <p class="mb-3">库存不足,需要审批才能继续执行出库流程。</p>
                    <div class="d-flex gap-2">
                        <button class="btn btn-success" onclick="approveOutbound()">
                            <i class="bi bi-check-circle me-2"></i>批准出库
                        </button>
                        <button class="btn btn-danger" onclick="rejectOutbound()">
                            <i class="bi bi-x-circle me-2"></i>拒绝出库
                        </button>
                    </div>
                </div>
            </div>

            <!-- 工作流日志 -->
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="bi bi-list-ul me-2"></i>工作流执行日志
                        </h5>
                        <button class="btn btn-sm btn-outline-primary" onclick="refreshLogs()">
                            <i class="bi bi-arrow-clockwise me-1"></i>刷新
                        </button>
                    </div>
                </div>
                <div class="card-body p-3" style="max-height: 500px; overflow-y: auto">
                    <div id="logs">
                        <div class="text-center text-muted py-5">
                            <i class="bi bi-hourglass-split" style="font-size: 3rem; opacity: 0.3"></i>
                            <p class="mt-3 mb-0">正在加载日志...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/site.js"></script>
    <script>
        let currentBatchNumber = '';
        let currentWorkflowInstanceId = '';
        let needsApproval = false;
        let refreshInterval = null;

        // 页面初始化
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            currentBatchNumber = params.get('batchNumber');
            currentWorkflowInstanceId = params.get('workflowId');

            if (!currentBatchNumber) {
                showMessage('缺少批号参数', 'error');
                setTimeout(() => window.location.href = 'scan.html', 2000);
                return;
            }

            document.getElementById('batchNumber').textContent = currentBatchNumber;
            document.getElementById('workflowId').textContent = currentWorkflowInstanceId || '未知';

            refreshLogs();
            refreshInterval = setInterval(refreshLogs, 2000);
        };

        // 页面卸载时清除定时器
        window.onbeforeunload = function() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        };

        async function refreshLogs() {
            try {
                const response = await fetch(`/api/WorkflowLog/batch/${currentBatchNumber}`);
                
                if (!response.ok) {
                    document.getElementById('logs').innerHTML = `
                        <div class="text-center text-muted py-5">
                            <i class="bi bi-exclamation-circle" style="font-size: 3rem; opacity: 0.3"></i>
                            <p class="mt-3 mb-0">日志加载失败</p>
                        </div>
                    `;
                    return;
                }
                
                const result = await response.json();
                const logs = result.data || result;
                
                if (Array.isArray(logs) && logs.length > 0) {
                    const logsHtml = logs
                        .sort((a, b) => a.stepOrder - b.stepOrder)
                        .map(log => {
                            const statusClass = log.executionStatus.toLowerCase();
                            const statusIcon = {
                                'completed': 'bi-check-circle-fill text-success',
                                'failed': 'bi-x-circle-fill text-danger',
                                'pending': 'bi-hourglass-split text-warning',
                                'compensating': 'bi-arrow-counterclockwise text-warning'
                            }[statusClass] || 'bi-circle text-secondary';

                            let approvalBadge = '';
                            if (log.requiresApproval) {
                                approvalBadge = '<span class="badge bg-warning text-dark ms-2">需要审批</span>';
                            }

                            return `
                                <div class="scan-item mb-2" style="border-left-color: ${
                                    statusClass === 'completed' ? '#28a745' : 
                                    statusClass === 'failed' ? '#dc3545' : 
                                    statusClass === 'pending' ? '#ffc107' : '#007bff'
                                }">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <div class="d-flex align-items-start flex-grow-1">
                                            <i class="bi ${statusIcon} me-3 fs-5"></i>
                                            <div class="flex-grow-1">
                                                <div class="fw-bold">
                                                    ${log.stepOrder}. ${log.stepName}${approvalBadge}
                                                </div>
                                                <p class="mb-1 text-muted">${log.statusMessage}</p>
                                                ${log.errorMessage ? `<p class="mb-1 text-danger small">错误: ${log.errorMessage}</p>` : ''}
                                                <small class="text-muted">${new Date(log.createdTime).toLocaleString('zh-CN')}</small>
                                            </div>
                                        </div>
                                        <span class="badge bg-${
                                            statusClass === 'completed' ? 'success' : 
                                            statusClass === 'failed' ? 'danger' : 
                                            statusClass === 'pending' ? 'warning' : 'secondary'
                                        } ms-2">${log.executionStatus}</span>
                                    </div>
                                </div>
                            `;
                        }).join('');

                    document.getElementById('logs').innerHTML = logsHtml;

                    // 检查日志中是否有需要审批的节点
                    const hasApprovalLog = logs.some(log => log.requiresApproval === true);
                    
                    if (hasApprovalLog) {
                        if (!needsApproval) {
                            needsApproval = true;
                            document.getElementById('approvalSection').classList.remove('d-none');
                        }
                    } else {
                        // 如果没有需要审批的日志,隐藏审批区域
                        if (needsApproval) {
                            needsApproval = false;
                            document.getElementById('approvalSection').classList.add('d-none');
                        }
                    }
                } else {
                    document.getElementById('logs').innerHTML = `
                        <div class="text-center text-muted py-5">
                            <i class="bi bi-inbox" style="font-size: 3rem; opacity: 0.3"></i>
                            <p class="mt-3 mb-0">暂无日志记录</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('查询日志失败:', error);
            }
        }

        async function approveOutbound() {
            if (!currentWorkflowInstanceId) {
                showMessage('未找到工作流实例 ID', 'error');
                return;
            }

            try {
                const response = await fetch(`/workflows/material/outbound/approve/${currentWorkflowInstanceId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ decision: 'approved' })
                });

                if (response.ok) {
                    showMessage('审批通过!出库流程继续执行', 'success');
                    needsApproval = false;
                    document.getElementById('approvalSection').classList.add('d-none');
                    setTimeout(() => refreshLogs(), 1000);
                } else {
                    showMessage('审批失败', 'error');
                }
            } catch (error) {
                showMessage('审批请求失败: ' + error.message, 'error');
            }
        }

        async function rejectOutbound() {
            if (!currentWorkflowInstanceId) {
                showMessage('未找到工作流实例 ID', 'error');
                return;
            }

            if (!confirm('确定要拒绝此出库申请吗?')) {
                return;
            }

            try {
                const response = await fetch(`/workflows/material/outbound/approve/${currentWorkflowInstanceId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ decision: 'rejected' })
                });

                if (response.ok) {
                    showMessage('审批已拒绝,流程终止', 'error');
                    needsApproval = false;
                    document.getElementById('approvalSection').classList.add('d-none');
                    setTimeout(() => refreshLogs(), 1000);
                } else {
                    showMessage('拒绝失败', 'error');
                }
            } catch (error) {
                showMessage('拒绝请求失败: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
