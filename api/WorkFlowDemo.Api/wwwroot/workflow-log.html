<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>工作流日志查询</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
            rel="stylesheet"
        />
        <link href="css/site.css" rel="stylesheet" />
    </head>
    <body>
        <div class="container py-4">
            <div class="main-container">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="page-title mb-0">
                        <i class="bi bi-journal-text text-primary"></i>
                        工作流执行日志
                    </h1>
                    <a href="index.html" class="btn btn-outline-secondary">
                        <i class="bi bi-house me-2"></i>返回首页
                    </a>
                </div>

                <!-- 查询选项卡 -->
                <ul class="nav nav-tabs mb-4" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#batch-tab" type="button">
                            <i class="bi bi-tag me-2"></i>按批次查询
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#instance-tab" type="button">
                            <i class="bi bi-diagram-3 me-2"></i>按实例查询
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#failed-tab" type="button">
                            <i class="bi bi-exclamation-triangle me-2"></i>失败日志
                        </button>
                    </li>
                </ul>

                <!-- 选项卡内容 -->
                <div class="tab-content">
                    <!-- 按批次查询 -->
                    <div class="tab-pane fade show active" id="batch-tab">
                        <div class="card shadow-sm mb-4">
                            <div class="card-body">
                                <div class="row g-3">
                                    <div class="col-md-8">
                                        <input type="text" class="form-control" id="batchNumberInput" placeholder="请输入批次号">
                                    </div>
                                    <div class="col-md-4">
                                        <button class="btn btn-gradient w-100" onclick="searchByBatch()">
                                            <i class="bi bi-search me-2"></i>查询
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 按实例查询 -->
                    <div class="tab-pane fade" id="instance-tab">
                        <div class="card shadow-sm mb-4">
                            <div class="card-body">
                                <div class="row g-3">
                                    <div class="col-md-8">
                                        <input type="text" class="form-control" id="instanceIdInput" placeholder="请输入工作流实例ID">
                                    </div>
                                    <div class="col-md-4">
                                        <button class="btn btn-gradient w-100" onclick="searchByInstance()">
                                            <i class="bi bi-search me-2"></i>查询
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 失败日志 -->
                    <div class="tab-pane fade" id="failed-tab">
                        <div class="card shadow-sm mb-4">
                            <div class="card-body">
                                <button class="btn btn-gradient" onclick="loadFailedLogs()">
                                    <i class="bi bi-arrow-clockwise me-2"></i>加载失败日志
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 加载状态 -->
                <div id="loading" class="loading-state" style="display: none">
                    <i class="bi bi-hourglass-split"></i>
                    <p>加载中...</p>
                </div>

                <!-- 空状态 -->
                <div id="empty" class="empty-state" style="display: none">
                    <i class="bi bi-inbox"></i>
                    <p>暂无数据</p>
                </div>

                <!-- 日志列表 -->
                <div id="logContainer" style="display: none">
                    <div class="card shadow-sm">
                        <div class="card-header bg-white py-3">
                            <h5 class="mb-0">
                                <i class="bi bi-list-check me-2"></i>执行日志
                                <span class="badge bg-primary rounded-pill ms-2" id="logCount">0</span>
                            </h5>
                        </div>
                        <div class="card-body p-0">
                            <div id="logList"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/site.js"></script>
        <script>
            const API_BASE = "/api/workflowlog";

            async function searchByBatch() {
                const batchNumber = document.getElementById("batchNumberInput").value.trim();
                if (!batchNumber) {
                    showMessage("请输入批次号", "error");
                    return;
                }
                await loadLogs(`${API_BASE}/batch/${encodeURIComponent(batchNumber)}`);
            }

            async function searchByInstance() {
                const instanceId = document.getElementById("instanceIdInput").value.trim();
                if (!instanceId) {
                    showMessage("请输入工作流实例ID", "error");
                    return;
                }
                await loadLogs(`${API_BASE}/instance/${encodeURIComponent(instanceId)}`);
            }

            async function loadFailedLogs() {
                await loadLogs(`${API_BASE}/failed?pageIndex=1&pageSize=50`);
            }

            async function loadLogs(url) {
                const logContainer = document.getElementById("logContainer");
                const logList = document.getElementById("logList");
                const logCount = document.getElementById("logCount");

                showLoading(true);
                showEmpty(false);
                logContainer.style.display = "none";

                try {
                    const response = await fetch(url);
                    const result = await response.json();

                    showLoading(false);

                    if (result.code === 200 && result.data && result.data.length > 0) {
                        logCount.textContent = result.data.length;
                        logList.innerHTML = result.data.map((log, index) => {
                            const statusClass = getStatusClass(log.executionStatus);
                            const statusIcon = getStatusIcon(log.executionStatus);
                            return `
                                <div class="border-bottom p-3 ${index % 2 === 0 ? 'bg-light' : ''}">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <div class="flex-grow-1">
                                            <div class="d-flex align-items-center mb-2">
                                                <span class="badge ${statusClass} me-2">
                                                    <i class="bi ${statusIcon} me-1"></i>${log.executionStatus}
                                                </span>
                                                <strong class="text-primary">${log.stepName}</strong>
                                            </div>
                                            <div class="text-muted mb-2">${log.statusMessage}</div>
                                            ${log.errorMessage ? `<div class="alert alert-danger py-2 mb-2"><i class="bi bi-exclamation-triangle me-2"></i>${log.errorMessage}</div>` : ''}
                                        </div>
                                        <small class="text-muted text-nowrap ms-3">${formatDateTime(log.createdTime)}</small>
                                    </div>
                                    <div class="row g-2 small text-muted">
                                        ${log.workflowDefinitionName ? `<div class="col-md-4"><i class="bi bi-diagram-3 me-1"></i>工作流: ${log.workflowDefinitionName}</div>` : ''}
                                        ${log.batchNumber ? `<div class="col-md-4"><i class="bi bi-tag me-1"></i>批次: ${log.batchNumber}</div>` : ''}
                                        ${log.operator ? `<div class="col-md-4"><i class="bi bi-person me-1"></i>操作人: ${log.operator}</div>` : ''}
                                        ${log.executionDuration ? `<div class="col-md-4"><i class="bi bi-clock me-1"></i>耗时: ${log.executionDuration}ms</div>` : ''}
                                        ${log.activityName ? `<div class="col-md-8"><i class="bi bi-gear me-1"></i>活动: ${log.activityName}</div>` : ''}
                                    </div>
                                </div>
                            `;
                        }).join("");
                        logContainer.style.display = "block";
                    } else {
                        showEmpty(true);
                    }
                } catch (error) {
                    showLoading(false);
                    showMessage("加载失败：" + error.message, "error");
                }
            }

            function getStatusClass(status) {
                const statusMap = {
                    'Started': 'bg-info',
                    'Running': 'bg-primary',
                    'Completed': 'bg-success',
                    'Failed': 'bg-danger',
                    'Compensating': 'bg-warning',
                    'Compensated': 'bg-secondary'
                };
                return statusMap[status] || 'bg-secondary';
            }

            function getStatusIcon(status) {
                const iconMap = {
                    'Started': 'bi-play-circle',
                    'Running': 'bi-arrow-repeat',
                    'Completed': 'bi-check-circle',
                    'Failed': 'bi-x-circle',
                    'Compensating': 'bi-arrow-counterclockwise',
                    'Compensated': 'bi-arrow-left-circle'
                };
                return iconMap[status] || 'bi-circle';
            }

            // 回车键搜索
            document.getElementById("batchNumberInput").addEventListener("keypress", (e) => {
                if (e.key === "Enter") searchByBatch();
            });

            document.getElementById("instanceIdInput").addEventListener("keypress", (e) => {
                if (e.key === "Enter") searchByInstance();
            });

            // 监听 tab 切换事件，清空数据
            document.querySelectorAll('button[data-bs-toggle="tab"]').forEach(button => {
                button.addEventListener('shown.bs.tab', () => {
                    document.getElementById("logContainer").style.display = "none";
                    document.getElementById("loading").style.display = "none";
                    document.getElementById("empty").style.display = "none";
                });
            });
        </script>
    </body>
</html>
